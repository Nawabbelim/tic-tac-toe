<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tic Tac Toe</h1>
    <div class="mode-toggle">
        <label class="switch">
            <input type="checkbox" id="threePlayerToggle">
            <span class="slider"></span> </label>
        <span id="em">✌️</span>
        <span id="em2">🤟</span>
    </div>


    <div class="container">

        <div id="onlineControls">
            <button id="createRoom">Create Room</button>

            <input type="text" id="roomCode" placeholder="Enter room code" maxlength="4">

            <button id="joinRoom">Join Room</button>

            <p id="onlineStatus">Play online with a friend!</p>
        </div>

        <div class="players">

            <div id="playerX" class="player active ">Player:X</div>
            <div id="playerO" class="player ">Player:O</div>
            <div id="playerN" class="player ">Player:N</div>
            <button id="restart">Restart Game</button>




        </div>


        <div class="boxes">
            <div class="box" data-board="1">
                <button class="cell" data-cell="1"></button>
                <button class="cell" data-cell="2"></button>

                <button class="cell" data-cell="5"></button>
